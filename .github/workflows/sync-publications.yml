name: Sync publications

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch publications from OpenAlex
        run: node scripts/fetch-publications.mjs
        env:
          ORCID: '0000-0002-8362-4761'
          PUBLICATION_LIMIT: '25'

      - name: Commit updated publications JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/publications.json
          if git diff --staged --quiet; then
            echo "No publication changes to commit."
          else
            git commit -m "Update publications from OpenAlex."
            git push
          fi
